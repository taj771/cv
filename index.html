  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;

      border-radius: 5px;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      transition: background 0.15s;
    }
    .btn:hover { background: #333; }
    .links { font-size: 0.88rem; color: #666; }
    .links a { color: #1a1a1a; text-decoration: none; border-bottom: 1px solid #ccc; }
